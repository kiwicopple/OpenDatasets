[project]
name = "opendatasets"
version = "0.1.0"
description = "Public embedding datasets for RAG applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyarrow>=15.0.0",
    "pyiceberg>=0.6.0",
    "openai>=1.0.0",
    "supabase>=2.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendatasets"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[project.scripts]
opendatasets = "opendatasets.cli:main"
